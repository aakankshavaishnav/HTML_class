<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            padding: 0;
            margin: 5%;
            box-sizing: border-box;
        }
        .container {
            display: grid;
            border: 2px solid red;
            height: 90vh;
         
            grid-template:
                "box1 box1 box1" 100px
                "box2 box2 box4" 20px
                "box2 box2 box4" 100px
                "box3 box3 box4" 140px/200px 200px 70px;

            /* column-gap: 10px; */
            /* row-gap: 10px; */
            justify-items: center; 
            align-items: end; 

        }   container div{
            
        }

        .box {
            border: 2px solid purple;
            background-color: lavender;
            height: 100px;
        }

        .b1 {
            grid-area: box1;
        }

        .b2 {
            grid-area: box2;
        }

        .b3 {
            grid-area: box3;
        }

        .b4 {
            grid-area: box4;
        }

        /* .b5 {
            grid-area: box5;
        } */
    </style>
</head>

<body>

    <div class="container">
        
        <div class="box b1">Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolorum, quibusdam.</div>
        <div class="box b2">header</div>
        <div class="box b3">hero</div>
        <div class="box b4">Lorem ipsum dolor sit amet consectetur.</div>
        <!-- <div class="box b5">5</div> -->
    </div>

</body>

</html>
