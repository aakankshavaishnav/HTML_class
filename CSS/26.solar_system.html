<!DOCTYPE html>
<html>

<head>
    <title>Solar System</title>

    <style>
        body {
            background-color: black;
        }

        .sun {
            height: 60px;
            width: 60px;
            background-color: orange;
            border-radius: 50%;
            margin: 200px auto;
            box-shadow: 0 0 30px yellow;
            display: flex;
            
        }

        .venus {
            height: 200px;
            width: 200px;
            border: 1px solid white;
            border-radius: 100%;
            position: absolute;
            top: 130px;
            left: 42%;
            animation: move 4s;
        }

        .mercury{
            height: 250px;
            width: 250px;
            border: 1px solid white;
            border-radius: 100%;
            animation: move;
            animation-duration: 5s;
            top: 100px;
            left: 212px;
            position: absolute;
        }

        .planet {
            height: 20px;
            width: 20px;
            background-color: rgb(100, 99, 98);
            border-radius: 50%;
        }

        .m-planet{
            height: 20px;
            width: 20px;
            background-color: rgb(241, 210, 37);
            border-radius: 50%;
            position: absolute;
            
        }
        .earth{
            height: 100px;
            height: 250px;
            width: 250px;
            border: 1px solid white;
            border-radius: 100%;
            animation: move;
            animation-duration: 5s;
            top: 100px;
            left: 212px;
            position: absolute;
        }
            .e-planet{
            height: 20px;
            width: 20px;
            background-color: rgb(241, 210, 37);
            border-radius: 50%;
            position: absolute;
            
        }
        

        @keyframes move {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="sun">
    <div class="mercury">
        <div class="m-planet"></div>
    </div>

    <div class="venus">
        <div class="planet"></div>
    </div>
    <div class="earth">
        <div class="e-planet"></div>
    </div>
    </div>

</body>

</html>
