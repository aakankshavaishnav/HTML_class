<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cont{
            display: grid;
            border: 4px solid rgb(232, 14, 14);

            background-color: rgb(227, 212, 215);
            height: 90vh;
            grid-template-areas: 
            "header header" 
            "hero sidebar"
            "hero sidebar" ;
            
           
        }
        .child{
            border: 2px solid red;

        }
        .header{
            grid-area: header;
            border: 2px solid rgb(235, 10, 10);
            grid-column-start: 2;
            grid-column-end:3;
            grid-row-start: 2;
            grid-row-end: 4;
        }
        .heroimg{
            grid-area: hero;
            border: 2px solid rgb(245, 13, 13);
        }
        .sidebar{
            grid-area: sidebar;

        }
    </style>
</head>
<body>
  <div class="cont">
  <div class="header">header</div>
  <div class="heroimg">hero img</div>
  <div class="sidebar">sidebar</div>
  <!-- <div class="child"></div>
  <div class="child"></div>
  <div class="child"></div>
  <div class="child"></div>
  <div class="child"></div> -->
  </div>  
</body>
</html>
