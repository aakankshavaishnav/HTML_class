<!DOCTYPE html>
<html>
<head>
<title>Sidebar</title>
<style>
  body {
    background-color: rgb(253, 254, 254);

  }

  aside {
    width: 280px;

    padding: 20px;

  }

  .top-text {
    font-weight: bold;
    font-size: 18px;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  ul li {
    padding: 10px;
    margin-bottom: px;
