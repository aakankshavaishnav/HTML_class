<!DOCTYPE html>
<html>
<head>
    <title>Grid</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 100px);
            border: 5px solid red;
        }

        .box {
            border: 4px solid black;
        }

        .box10 {
            grid-column-start: 2;
            grid-column-end: 3;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box box10">10</div>
    </div>

</body>
</html>
