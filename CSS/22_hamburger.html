<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hamburger</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* background-color: #f5f5f5; */
            /* border: 2px solid yellow; */
        }
        .nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: white;
            border: 2px solid red;
        }
        .logo h1{
            font-size: 30px;
            font-weight: bold;
        }
        .ul{
            display: flex;
            gap: 10px;
            list-style-type: none;
        }
        .ul li a{
            text-decoration: none;
            color: black;
            font-size: 18px;
        }
        .hamburger{
            display: none;
            flex-direction: column;
            cursor: pointer;

        }
        .hamburger:hover{
            background-color: rgb(233, 10, 10);
            border-radius: 5px;
            display: ;
        }
        .hamburger span{
            height: 3px;
            width: 25px;
            background-color: black;
            margin-bottom: 4px;

        }
        @media all and (max-width:786px){
            .hamburger{
                display: flex;
            }
        }
        .box{
            width: 100%;
            height: 500px;
            border: 2px solid black;
            margin-top: 2px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .box2{
            width:50%;
            height: 100px;
            border: 2px solid rgb(233, 10, 10);
            margin-top: 2px;
            /* border: 2px solid red; */
            /* border: 2px yellow; */
        }
        .box3{
            width:50%;
            height: inherit;
            border: 2px solid rgb(233, 10, 10);
            margin-top: 2px;
            /* border: 2px solid red; */
            /* border: 2px yellow; */
        }
        </style>
</head>
<body>
    <nav class="nav">
        <div class="logo">
            <h1>LOGO</h1>
        </div>
        <ul class="ul">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>
    <div class="box">
        <h1>Box</h1>
        <div class="box2">
            <h1></h1    >

        </div>
        <div class="box3">
            <h1></h1>
        </div>
    </div>
    
    
</body>
</html>
