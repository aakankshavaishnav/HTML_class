        .main {
            display: flex;
            height: 1450px;
            width: 90vw;
            border: 2px solid green;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }


        .main div {
            height: 100px;
            width: 200px;
            border: 2px solid yellow;
        }

        .one {
            order: 3;
            background-color: chartreuseS;
        }

        .two {
            order: 2;
            background-color: rgb(135, 197, 222);
        }

<body>
    <div class="main">
        <div class="cont">

    </div>
