<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hamburger</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: white;
            border: 2px solid red;
        }
        .logo h1{
            font-size: 30px;
            font-weight: bold;
        }
        .ul{
            display: flex;
            gap: 10px;
            list-style-type: none;
        }
        .ul li a{
            text-decoration: none;
            color: black;
            font-size: 18px;
        }
        .hamburger{
            display: none;
            flex-direction: column;
            cursor: pointer;
            padding: 6px;
            border-radius: 5px;
            position: relative;
            transition: background-color 0.3s ease;
        }
        .hamburger:hover{
            background-color: rgb(235, 208, 208);
            /* display: none; */
        }
        .hamburger span{
            height: 3px;
            width: 25px;
            background-color: black;
            margin-bottom: 4px;
            transition: background-color 0.3s ease, width 0.3s ease;
        }
        .hamburger span:last-child{
            margin-bottom: 0;
        }
        .hamburger:hover span{
            background-color: white;
        }
        /* .hamburger:hover span:nth-child(2){
            width: 18px;
        } */
        /* Hover text */
        /* .hamburger::after{
            content: "Menu";
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            padding: 4px 10px;
            background-color: black;
            color: white;
            font-size: 14px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s ease;
        } */
        .hamburger:hover::after{
            opacity: 1;
            visibility: visible;
        }
        @media all and (max-width:786px){
            .hamburger{
                display: flex;
            }
        }
        .box{
            width: 100%;
            height: 500px;
            border: 2px solid black;
            margin-top: 2px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .box2{
            width:50%;
            height: 100px;
            border: 2px solid rgb(233, 10, 10);
            margin-top: 2px;
        }
        .box3{
            width:50%;
            height: inherit;
            border: 2px solid rgb(233, 10, 10);
            margin-top: 2px;
        }
        /* .hamburger ul{ */
            /* display: none; */
        /* } */
      
    </style>
</head>
<body>
    <nav class="nav">
        <div class="logo">
            <h1>LOGO</h1>
        </div>
        <ul class="ul">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
            <ul>
                <li><a href="">home</a>
                </li>
                <li><a href="">class</a></li>
                <li><a href="">page</a></li>
                <li><a href="">products</a></li>
            </ul>
        </div>
    </nav>
    <div class="box">
        <h1>Box</h1>
        <div class="box2">
            <h1></h1>
        </div>
        <div class="box3">
            <h1></h1>
        </div>
    </div>
</body>
</html>
