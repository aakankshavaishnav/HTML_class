<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navbar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    height: 64px;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.1);
  }

  .logo { font-size: 26px; font-weight: bold; }

  nav ul { list-style: none; display: flex; gap: 25px; }
  nav li { position: relative; }

  nav a {
    text-decoration: none;
    color: #222;
    padding: 22px 0;
    display: block;
  }
  nav a:hover { color: #6a1b9a; }

  /* dropdown */
  .dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 160px;
    background: #fff;
    flex-direction: column;
    gap: 0;
    box-shadow: 0 4px 10px rgba(0,0,0,.15);
    display: none;
  }
  .dropdown a { padding: 10px 16px; }
  .dropdown a:hover { background: #f3e5f5; }

  li:hover > .dropdown { display: flex; }
</style>
</head>
<body>

<nav>
  <div class="logo">logo</div>
  <ul>
    <li><a href="#">home</a></li>
    <li>
      <a href="#">about</a>
      <ul class="dropdown">
        <li><a href="#">about job</a></li>
        <li><a href="#">about app</a></li>
        <li><a href="#">clothes</a></li>
      </ul>
    </li>
  </ul>
</nav>

</body>
</html
