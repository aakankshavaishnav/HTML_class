
<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <style>
body {
    margin: 0;
    background-color: #1c1c1c;
    font-family: Arial, sans-serif;
}

.calculator {
    width: 600px;
    margin: auto;
    padding: 20px;
    box-sizing: border-box;
}

.display {
    height: 180px;
    color: white;
    font-size: 100px;
    text-align: right;
    padding-top: 20px;
    box-sizing: border-box;
}

.buttons {
    text-align: center;
    font-size: 0;
}

button {
    width: 109px;
    height: 109px;
    border: none;
    border-radius: 50%;
    background-color: #505050;
    color: white;
    font-size: 30px;
    margin: 5px;
    cursor: pointer;
    vertical-align: middle;
}

.light {
    background-color: #b0b0b0;
    color: black;
}

.orange {
    background-color: #ff9800;
}

.zero {
    width: 243px;
    border-radius: 60px;
    text-align: left;
    padding-left: 30px;
}
</style>
 
    
</head>
<body>

<div class="calculator">

    <div class="display">5674</div>

    <div class="buttons">
        <button class="light">C</button>
        <button class="light">+/-</button>
        <button class="light">%</button>
        <button class="orange">÷</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="orange">X</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="orange">-</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="orange">+</button>

        <button class="zero">0</button>
        <button>,</button>
        <button class="orange">=</button>
    </div>

</div>

</body>
</html>
