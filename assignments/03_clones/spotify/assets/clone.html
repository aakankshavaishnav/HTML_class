<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #121212;
        }

        .main {
            display: flex;
            width: 100%;
            height: 100vh;
            border: white 1px solid;
        }

        aside {
            width: 20%;
            margin: 1%;
            margin-top: 2%;
            height: 85%;
            background-color: #000000;
            color: white;
            padding: 20px;
            border: 2px solid yellow;
        }

        li {
            list-style-type: none;
            margin-bottom: 10px;
            cursor: pointer;
            gap: 10px;
            display: flex;
            margin-top: 15px;
        }

        .sec {
            margin-top: 50px;
        }

        .thir {
            margin-top: 50px;
        }

        .content {
            width: 80%;
            /* margin: 1%; */
            margin-right: 1%;
            margin-top: 2%;
            height: 85%;
            background-color: #000000;
            color: white;
            padding: 20px;
            border: 2px solid yellow;
        }

        .cont-c {
            display: flex;
            gap: 10px;
            height: 60px;
            width: 200px;
            background-color: #303030;
            margin-top: 5%;

        }
        div.card {
            display: flex;
            gap: 10px;
            height: 60px;
            width: 200px;
            background-color: #303030;
            /* margin-top: 5%; */
        }
        .inner{
            display: flex;
            gap: 10px;
            height: 250px;
            width: 200px;
            background-color: #303030;
            margin-top: 5%;
        }
        
    </style>
</head>

<body>
    <div class="main">
        <aside>
            <li class="logo"><img src="Spotify logo.png" alt="" height="50px"></li>
            <li> <img src="Home.png" alt="" height="15px">Home</li>
            <li> <img src="Search.png" alt="" height="15px">Search</li>
            <li> <img src="Your library.png" alt="" height="15px">Your Library</li>
            <hr class="sec">
            <li class="sec"> <img src="Create.png" height="15px" alt="">Create Playlist</li>
            <li> <img src="Liked.png" alt="" height="15px">Liked Songs</li>
            <li> <img src="Your episodes.png" alt="" height="15px">Your Episodes</li>
            <hr class="thir">
            <li class="thir">FAV</li>
            <li>Daily Mix</li>
            <li>Discover Weekly</li>
            <li>Malayalam</li>
            <li>Dance/electronic mix</li>
            <li>edm Popular</li>
        </aside>
        <div class="content">
            <img src="top arrow navigation.png" height="25px" alt="">

            <h1>Good morning</h1>
            <div class="cont-c">
                <div class="card">
                    <img src="image11.png" alt="" background-size="cover" height="60px">
                    <li>Liked songs</li>
                </div>
            </div>
            <div class="card2">
                <h1>Show you might like</h1>
                <div class="inner">
                    <li><img src="image9.png" alt=""></li>
                    <li><img src="image8.png" alt=""></li>
                    <li><img src="image7.png" alt=""></li>
                    <li><img src="image6.png" alt=""></li>
                    <li><img src="image5.png" alt=""></li>
                    <li><img src="image4.png" alt=""></li>
                    <li><img src="image3.png" alt=""></li>
                </div>
            </div>
        </div>
</body>

</html>
