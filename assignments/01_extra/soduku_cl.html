
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 40px 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 35px;
            flex-wrap: wrap;
        }

        .box {
            text-align: center;
        }

        h2 {
            font-size: 23px;
            font-weight: normal;
            letter-spacing: 3px;
            margin-bottom: 18px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(9, 32px);
            grid-template-rows: repeat(9, 32px);
            border: 2px solid black;
        }

        .cell {
            border: 1px solid #777;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
        }

        /* Green boxes */
        .green {
            background-color: #a8d5b8;
        }

        /* Thick vertical lines */
        .cell:nth-child(3n):not(:nth-child(9n)) {
            border-right: 2px solid black;
        }

        /* Thick horizontal lines */
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid black;
        }

        @media (max-width: 600px) {
            .board {
                grid-template-columns: repeat(9, 28px);
                grid-template-rows: repeat(9, 28px);
            }

            .cell {
                font-size: 18px;
            }

            .container {
                gap: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box">
            <h2>SUDOKU</h2>
            <div class="board" id="sudoku"></div>
        </div>

        <div class="box">
            <h2>ANSWER</h2>
            <div class="board" id="answer"></div>
        </div>

    </div>

    <script>
        let puzzle = [
            [8, 0, 6, 0, 0, 3, 0, 9, 0],
            [0, 4, 0, 0, 1, 0, 0, 6, 8],
            [2, 0, 0, 8, 7, 0, 0, 0, 5],
            [1, 0, 8, 0, 0, 5, 0, 2, 0],
            [0, 3, 0, 1, 0, 0, 0, 5, 0],
            [7, 0, 5, 0, 3, 0, 9, 0, 0],
            [0, 2, 1, 0, 0, 7, 0, 4, 0],
            [6, 0, 0, 0, 2, 0, 8, 0, 0],
            [0, 8, 7, 6, 0, 4, 0, 0, 3]
        ];

        let solution = [
            [8, 7, 6, 5, 4, 3, 1, 9, 2],
            [5, 4, 3, 2, 1, 9, 7, 6, 8],
            [2, 1, 9, 8, 7, 6, 4, 3, 5],
            [1, 9, 8, 7, 6, 5, 3, 2, 4],
            [4, 3, 2, 1, 9, 8, 6, 5, 7],
            [7, 6, 5, 4, 3, 2, 9, 8, 1],
            [3, 2, 1, 9, 8, 7, 5, 4, 6],
            [6, 5, 4, 3, 2, 1, 8, 7, 9],
            [9, 8, 7, 6, 5, 4, 2, 1, 3]
        ];

        function createBoard(data, boardId, isAnswer) {
            let board = document.getElementById(boardId);

            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {

                    let cell = document.createElement("div");
                    cell.classList.add("cell");

                    // Green boxes
                    if (
                        (i < 3 && j >= 3 && j < 6) ||
                        (i >= 3 && i < 6 &&
                            (j < 3 || j >= 6)) ||
                        (isAnswer && j >= 3 && j < 6)
                    ) {
                        cell.classList.add("green");
                    }

                    if (data[i][j] !== 0) {
                        cell.textContent = data[i][j];
                    }

                    board.appendChild(cell);
                }
            }
        }

        createBoard(puzzle, "sudoku", false);
        createBoard(solution, "answer", true);
    </script>

</body>
</html>
